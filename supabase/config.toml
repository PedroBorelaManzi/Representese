
[functions.get-holidays]
enabled = true
verify_jwt = false
import_map = "./functions/get-holidays/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/get-holidays/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/get-holidays/*.html" ]

[functions.google-calendar-proxy]
# Desativada na auditoria de 2026-09-23 — sem uso real no app, era um relay
# aberto pra API do Google Calendar. Ver comentário no index.ts.
enabled = true
verify_jwt = true
import_map = "./functions/google-calendar-proxy/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/google-calendar-proxy/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/google-calendar-proxy/*.html" ]
