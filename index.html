<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Representese</title>
    <meta name="description" content="Representese: A revolução tecnológica para representantes comerciais. Domine sua carteira de clientes, automatize pedidos e vende mais com menos esforço." />
    <meta name="google-site-verification" content="fJiSiQBY71SJnaiDn3Q_nlroCsarWvMBe2BEcGNPqU" />

    <!-- OpenGraph — preview rico ao compartilhar no WhatsApp/redes -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Represente-Se!" />
    <meta property="og:title" content="Represente-Se! — CRM para Representantes Comerciais" />
    <meta property="og:description" content="Centralize clientes, pedidos, agenda e faturamento. A revolução tecnológica para representantes comerciais brasileiros." />
    <meta property="og:url" content="https://www.representese.com/" />
    <meta property="og:image" content="https://www.representese.com/og-image.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Represente-Se! — CRM para Representantes Comerciais" />
    <meta name="twitter:description" content="Centralize clientes, pedidos, agenda e faturamento. Venda mais com menos esforço." />
    <meta name="twitter:image" content="https://www.representese.com/og-image.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preconnect e Preload para otimização de Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" as="style" />
    <!-- Leaflet CSS vem do bundle (import em src/components/Map.tsx) — o link externo do unpkg era bloqueado pelo CSP -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Aplica o tema salvo antes do React montar, evitando flash de tema errado -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
