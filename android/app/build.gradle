apply plugin: 'com.android.application'

// Assinatura de release: lida de android/keystore.properties, que NÃO vai pro Git
// (veja android/keystore.properties.example para o formato). Sem esse arquivo,
// o build de release continua funcionando sem assinatura customizada — só o
// bundleRelease/assembleRelease final pra subir na Play Store exige ele configurado.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.representese.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.representese.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 47
        versionName "1.44"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystoreProperties ? signingConfigs.release : null
        }
    }
}

// A sincronização do macOS (iCloud na Área de Trabalho, Google Drive etc.) cria
// cópias de conflito com espaço no nome — "config 2.xml", "strings 2.xml". Nome
// de recurso do Android só aceita a-z, 0-9 e underscore, então qualquer arquivo
// assim em res/ derruba o build inteiro com "' ' is not a valid file-based
// resource name character". Como o config.xml é regerado pelo `cap sync` a cada
// build, a cópia reaparecia e era preciso apagar na mão toda vez.
//
// Nenhum arquivo válido de res/ ou assets/ tem espaço no nome, então dá para
// remover sem risco antes do merge de recursos.
// Vale para TODOS os módulos (app, plugins do Capacitor, plugins Cordova), não
// só o :app — a cópia de conflito pode cair na pasta de qualquer um deles, e aí
// o build quebra do mesmo jeito.
// Nome de recurso do Android: só a-z, 0-9 e underscore.
def nomeDeRecursoValido = { String nome -> nome ==~ /^[a-z0-9_]+(\.[a-z0-9]+)*$/ }

tasks.register('limparDuplicadosDeSincronizacao') {
    doLast {
        def raiz = rootProject.projectDir
        def removidos = 0

        def remover = { File arquivo ->
            logger.lifecycle("Removendo arquivo de nome inválido para o Android: ${arquivo}")
            arquivo.delete()
            removidos++
        }

        // 1) Código-fonte de todos os módulos (app, plugins do Capacitor e Cordova).
        fileTree(raiz) {
            exclude '**/build/**', '**/.gradle/**', '**/node_modules/**'
            include '**/src/**/res/**', '**/src/**/assets/**'
        }.each { arquivo ->
            def emRes = arquivo.path.replace(File.separator, '/') =~ '/res/'
            // Em assets/, maiúscula e hífen são legítimos (saída do Vite) —
            // ali só o espaço é problema.
            def invalido = emRes ? !nomeDeRecursoValido(arquivo.name) : arquivo.name.contains(' ')
            if (invalido) remover(arquivo)
        }

        // 2) Cópias já geradas em build/. Limpar só a origem não bastava: o
        // arquivo ruim continuava em packaged_res/merged_res de um build
        // anterior, e era ali que parseReleaseLocalResources ia tropeçar —
        // exigindo um "Clean Project" manual a cada vez. Como é conteúdo
        // derivado, apagar é seguro: se a tarefa que preenche essas pastas
        // rodar de novo, ela recopia a partir da origem, que já está limpa.
        fileTree(raiz) {
            include '**/build/intermediates/packaged_res/**', '**/build/intermediates/merged_res/**'
        }.each { arquivo ->
            if (!nomeDeRecursoValido(arquivo.name)) remover(arquivo)
        }

        if (removidos > 0) {
            logger.lifecycle("Limpeza concluída: ${removidos} arquivo(s) removido(s).")
        }
    }
}

tasks.named('preBuild') { dependsOn('limparDuplicadosDeSincronizacao') }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
