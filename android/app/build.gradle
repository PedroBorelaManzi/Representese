apply plugin: 'com.android.application'

// Assinatura de release: lida de android/keystore.properties, que NÃO vai pro Git
// (veja android/keystore.properties.example para o formato). Sem esse arquivo,
// o build de release continua funcionando sem assinatura customizada — só o
// bundleRelease/assembleRelease final pra subir na Play Store exige ele configurado.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.representese.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.representese.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystoreProperties ? signingConfigs.release : null
        }
    }
}

// A sincronização do macOS (iCloud na Área de Trabalho, Google Drive etc.) cria
// cópias de conflito com espaço no nome — "config 2.xml", "strings 2.xml". Nome
// de recurso do Android só aceita a-z, 0-9 e underscore, então qualquer arquivo
// assim em res/ derruba o build inteiro com "' ' is not a valid file-based
// resource name character". Como o config.xml é regerado pelo `cap sync` a cada
// build, a cópia reaparecia e era preciso apagar na mão toda vez.
//
// Nenhum arquivo válido de res/ ou assets/ tem espaço no nome, então dá para
// remover sem risco antes do merge de recursos.
// Vale para TODOS os módulos (app, plugins do Capacitor, plugins Cordova), não
// só o :app — a cópia de conflito pode cair na pasta de qualquer um deles, e aí
// o build quebra do mesmo jeito.
tasks.register('limparDuplicadosDeSincronizacao') {
    doLast {
        def raiz = rootProject.projectDir
        def removidos = 0

        fileTree(raiz) {
            // build/ e .gradle/ são regerados; node_modules não entra no APK.
            exclude '**/build/**', '**/.gradle/**', '**/node_modules/**'
            include '**/src/**/res/**', '**/src/**/assets/**'
        }.each { arquivo ->
            // O Android exige nome de recurso só com a-z, 0-9 e underscore. O
            // caso comum aqui é a cópia do macOS ("config 2.xml"), mas qualquer
            // nome inválido derruba o build igual, então a checagem cobre tudo.
            def dentroDeRes = arquivo.path.replace(File.separator, '/') =~ '/res/'
            def nomeInvalido = dentroDeRes
                ? !(arquivo.name ==~ /^[a-z0-9_]+(\.[a-z0-9]+)*$/)
                : arquivo.name.contains(' ')
            if (nomeInvalido) {
                logger.lifecycle("Removendo arquivo de nome inválido para o Android: ${arquivo}")
                arquivo.delete()
                removidos++
            }
        }

        if (removidos > 0) {
            logger.lifecycle("Limpeza concluída: ${removidos} arquivo(s) removido(s).")
        }
    }
}

tasks.named('preBuild') { dependsOn('limparDuplicadosDeSincronizacao') }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
